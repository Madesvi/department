services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DB_HOST=db # Указываем имя сервиса базы
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: serverdb
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: school
    ports:
      - "5432:5432"
